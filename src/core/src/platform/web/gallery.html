<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loom Examples</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ccc;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      display: flex;
      height: 100dvh;
      overflow: hidden;
    }

    #sidebar {
      width: 200px;
      min-width: 200px;
      background: #1a1a1a;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    #sidebar h1 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #555;
      padding: 16px 14px 8px;
    }

    #sidebar button {
      background: none;
      border: none;
      color: #999;
      text-align: left;
      padding: 7px 14px;
      cursor: pointer;
      width: 100%;
      font-size: 13px;
      transition: background .1s, color .1s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #sidebar button:hover  { background: #222; color: #eee; }
    #sidebar button.active { background: #2d2d2d; color: #fff; }

    #main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    #placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <nav id="sidebar">
    <h1>Examples</h1>
  </nav>
  <main id="main">
    <div id="placeholder">Select an example</div>
    <iframe id="preview" src="about:blank"></iframe>
  </main>

  <script>
    // Injected by CMake — array of { id, label, path } objects.
    const EXAMPLES = [
      @GALLERY_EXAMPLES@
    ];

    const sidebar     = document.getElementById('sidebar');
    const preview     = document.getElementById('preview');
    const placeholder = document.getElementById('placeholder');

    let activeBtn = null;

    function loadExample(ex) {
      if (activeBtn) activeBtn.classList.remove('active');
      activeBtn = document.getElementById('btn-' + ex.id);
      if (activeBtn) activeBtn.classList.add('active');
      placeholder.style.display = 'none';
      preview.src = ex.path + '/index.html';
      history.replaceState(null, '', '#' + ex.id);
      document.title = ex.label + ' \u2014 Loom';
    }

    EXAMPLES.forEach(ex => {
      const btn = document.createElement('button');
      btn.id          = 'btn-' + ex.id;
      btn.textContent = ex.label;
      btn.title       = ex.label;
      btn.addEventListener('click', () => loadExample(ex));
      sidebar.appendChild(btn);
    });

    // Restore from URL hash, or load the first example.
    const hash    = location.hash.slice(1);
    const initial = EXAMPLES.find(e => e.id === hash) ?? EXAMPLES[0];
    if (initial) loadExample(initial);
  </script>
</body>
</html>
