<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loom</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      overflow: hidden;
    }

    #loom-canvas {
      display: block;
      /* pixelated keeps the raster crisp when the browser scales it */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: default;
    }
  </style>
</head>
<body>
  <canvas id="loom-canvas" width="800" height="600"></canvas>
  <script src="loom.js"></script>
</body>
</html>
